<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pitch Piano</title>
<meta name="description" content="Sing and see your pitch, with a full piano.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitch Piano">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d12">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-v3-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-v3-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="micBtn" class="round mic" aria-label="Start listening">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div id="readout" class="readout idle">
      <div class="big" id="rNote">–</div>
      <div class="sub"><span id="rLevel" class="level"></span><span id="rHz"></span><span id="rCents" class="cents"></span></div>
    </div>
    <div class="top-right">
      <button id="pauseBtn" class="round" aria-label="Pause" disabled>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="setBtn" class="round" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></svg>
      </button>
    </div>
  </header>
  <div class="subbar">
    <button id="rangeChip" class="chip">Range –</button>
    <button id="tuneChip" class="chip">A4 = 440 Hz</button>
  </div>
  <main id="graphWrap" class="graph-wrap">
    <canvas id="graph"></canvas>
    <div id="graphMsg" class="graph-msg">
      <button id="startBtn" class="start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        Start listening
      </button>
      <p id="msgText">Sing, and your pitch draws here.</p>
    </div>
    <div id="pausedTag" class="tag">Paused</div>
  </main>
  <section class="piano">
    <div class="piano-bar">
      <button id="octDown" class="mini" aria-label="Octave down">‹</button>
      <canvas id="minimap" aria-label="Keyboard overview: tap or drag to move along the keyboard"></canvas>
      <button id="octUp" class="mini" aria-label="Octave up">›</button>
      <button id="sustainBtn" class="chip toggle" aria-pressed="false">Sustain</button>
    </div>
    <div id="kbd" class="kbd"><div id="kbdInner" class="kbd-inner"></div></div>
    <div id="loading" class="loading"></div>
  </section>
</div>

<div id="installTip" class="install-tip" hidden>
  <span>For the full-screen app: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span>
  <button id="tipClose" aria-label="Dismiss">✕</button>
</div>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-label="Settings">
    <div class="head"><h2>Settings</h2><button id="doneBtn" class="done">Done</button></div>
    <div class="body scroll" id="settingsBody"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
